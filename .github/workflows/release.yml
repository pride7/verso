# 构建并发布 Verso 桌面端与 Android 安装包。DESIGN.md §2.11
#
# 推送版本标签时触发；这是 AGENTS.md 所述「更新版本号 → 编写 CHANGELOG →
# 提交 → 创建标签」发布流程的最后阶段：
#
#   node scripts/version.mjs 0.6.14
#   git commit -am "…"
#   git tag v0.6.14
#   git push && git push origin v0.6.14
#
# 流水线创建的 Release 保持为草稿，由维护者核验全部平台产物后手动发布。
# 这样既能在单个平台构建失败时重新执行，也能避免未完成版本被自动更新服务发现。
# `latest.json` 使用 `releases/latest/download/…` 地址，仅指向已正式发布且非预发布的
# 最新版本；草稿阶段不会向客户端提供更新。
name: release

on:
  push:
    tags:
      - "v*"
  # 用于重新构建指定版本，例如补充已发布版本的 Android APK。
  workflow_dispatch:
    inputs:
      tag:
        description: "需要构建的版本标签，例如 v0.6.14"
        required: true
      only:
        description: "构建范围；android 仅重新生成 APK 并更新下载说明"
        type: choice
        options: [all, android]
        default: all

jobs:
  build:
    name: 构建桌面安装包（${{ matrix.platform }}）
    # 仅补充 Android APK 时跳过桌面端构建。tauri-action 向现有 Release 上传
    # 同名资产会失败，且已有桌面端产物无需重复生成。
    if: ${{ github.event_name == 'push' || github.event.inputs.only != 'android' }}
    permissions:
      contents: write
    strategy:
      # 单个平台失败时，其他平台仍应继续构建，以便保留可用产物和诊断信息。
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Linux 需要额外的系统依赖：
      # - libssl-dev：git2 在 Linux 上使用 OpenSSL 提供 HTTPS；
      # - libdbus-1-dev：keyring 通过基于 D-Bus 的 Secret Service 存储凭据。
      # Windows 使用 Schannel，macOS 使用系统安全框架，不需要安装上述依赖。
      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libdbus-1-dev \
            build-essential curl wget file pkg-config patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: verso/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: verso/src-tauri -> target
          # 各目标平台必须使用独立缓存，避免不同编译目标相互覆盖。
          key: ${{ matrix.args }}

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
        working-directory: verso

      # Release 正文取自 CHANGELOG 对应版本，并由 tauri-action 写入
      # `latest.json.notes`，供客户端「检查更新」界面显示。
      # 若未找到对应版本，脚本将失败，避免创建缺少更新说明的 Release。
      - name: 提取版本更新说明
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<VERSO_EOF'
            node scripts/release-notes.mjs "${{ github.event.inputs.tag || github.ref_name }}"
            echo 'VERSO_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 自动更新包必须签名；客户端使用 tauri.conf.json 中
          # plugins.updater.pubkey 配置的公钥验证签名。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 当前私钥未设置密码，因此必须显式传入空字符串。不要改用 Secret：
          # Windows PowerShell 执行 `gh secret set X --body ""` 时可能存入字面引号，
          # 从而导致密码校验失败。此变量也不能省略，否则 Tauri 会等待交互式密码输入，
          # 使 CI 任务一直等待直至超时。
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: verso
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: Verso ${{ github.event.inputs.tag || github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          # Windows 的 `targets: all` 同时生成 MSI 与 NSIS 安装包。自动更新优先使用
          # NSIS，以支持 installMode: passive；MSI 安装过程需要用户账户控制确认。
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  # 构建 Android arm64 Release APK。tauri-action 仅处理桌面端，Android 产物
  # 由本任务生成，并在 finalize 任务中上传至同一草稿 Release。
  #
  # 签名密钥不提交至仓库（gen/android/.gitignore 排除 keystore.properties），
  # CI 通过以下四个 Secret 恢复签名配置：
  #   ANDROID_KEYSTORE_B64       —— verso-release.jks 的 base64
  #   ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
  # 未配置 Secret 时仍允许完成构建，以保持派生仓库可构建；此时产物未签名，
  # 无法安装，流水线会输出警告。
  android:
    name: 构建 Android 安装包
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: verso/pnpm-lock.yaml
      # AGP（compileSdk 36）要求 JDK 17 或更高版本，不能依赖 runner 默认配置。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # NDK 版本与本地构建脚本保持一致（见 verso/scripts/android-apk.ps1）。
      # Gradle 可能按需安装 platform 与 build-tools，因此预先接受相关许可证。
      - name: 安装 Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: verso/src-tauri -> target
          key: android

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
        working-directory: verso

      - name: 配置 Android 签名
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_B64；本次生成的 APK 未签名，无法安装。"
            exit 0
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/verso-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/verso-release.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > verso/src-tauri/gen/android/keystore.properties

      # `tauri android init` 不读取 src-tauri/icons/android/，并会在 res/ 中写入
      # 默认图标（见 AGENTS.md）。构建前始终同步项目图标，避免重新初始化后误用默认资源。
      - name: 同步 Android 应用图标
        run: |
          cp -r verso/src-tauri/icons/android/mipmap-* verso/src-tauri/gen/android/app/src/main/res/
          cp verso/src-tauri/icons/android/values/* verso/src-tauri/gen/android/app/src/main/res/values/

      # Linux runner 支持直接创建符号链接，可完整执行 Tauri Android 构建流程，
      # 无需使用 Windows 本地脚本中的复制与跳步处理。
      - name: 构建 Android APK
        run: pnpm tauri android build --apk --target aarch64
        working-directory: verso

      # Gradle 默认生成 app-universal-release.apk，其中 app 是模块名。
      # 发布资产统一采用 Verso_<版本>_<架构>.<扩展名> 命名。
      #
      # 不固定变体名称：`tauri android build` 生成 universal 变体，本地
      # android-apk.ps1 直接调用 Gradle 时生成 arm64 变体；两者均仅包含上述
      # aarch64 目标，因此按文件模式定位产物。
      - name: 规范化 Android 产物名称
        run: |
          VERSION=$(node -p "require('./verso/package.json').version")
          SRC=$(find verso/src-tauri/gen/android/app/build/outputs/apk -name "app-*-release.apk" | head -1)
          test -n "$SRC" && test -f "$SRC"
          cp "$SRC" "Verso_${VERSION}_arm64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Verso_*.apk
          if-no-files-found: error

  # 所有构建完成后执行以下操作：
  # 1. 将 Android APK 上传至同一 Release（支持草稿或已发布状态）；
  # 2. 在 Release 正文末尾追加平台与安装包对照表。
  # 下载说明在 latest.json 上传后追加，因此仅显示于 GitHub Release 页面，客户端
  # 「检查更新」仍只读取 CHANGELOG 内容。不得重命名已有资产：latest.json 保存的是
  # 原始下载地址，重命名会导致自动更新请求返回 404。
  finalize:
    name: 汇总发布资产与下载说明
    needs: [build, android]
    # 仅补充 Android APK 时 build 状态为 skipped，仍需执行本任务。
    if: ${{ !cancelled() && needs.android.result == 'success' && needs.build.result != 'failure' }}
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
      - name: 上传 Android APK 至 Release
        run: gh release upload "$TAG" Verso_*_arm64.apk --clobber
      - name: 更新 Release 下载说明
        run: |
          VERSION="${TAG#v}"
          node scripts/release-notes.mjs "$TAG" > body.md
          {
            echo
            echo "---"
            echo
            echo "### 安装包选择"
            echo
            echo "| 平台 | 推荐安装包 |"
            echo "|---|---|"
            echo "| Windows 10 / 11 | \`Verso_${VERSION}_x64-setup.exe\` |"
            echo "| macOS（Apple Silicon，M 系列芯片） | \`Verso_${VERSION}_aarch64.dmg\` |"
            echo "| macOS（Intel 芯片） | \`Verso_${VERSION}_x64.dmg\` |"
            echo "| Android（arm64） | \`Verso_${VERSION}_arm64.apk\` |"
            echo "| Linux（Debian / Ubuntu） | \`Verso_${VERSION}_amd64.deb\` |"
            echo "| Linux（Fedora / openSUSE） | \`Verso-${VERSION}-1.x86_64.rpm\` |"
            echo "| Linux（其他发行版） | \`Verso_${VERSION}_amd64.AppImage\` |"
            echo
            echo "> Windows 同时提供 MSI 安装包，适用于需要 MSI 部署的环境；一般安装建议使用 setup.exe。"
            echo "> \`.sig\` 与 \`latest.json\` 由自动更新机制使用，无需手动下载。"
            echo "> macOS 安装包目前尚未完成 Apple 签名与公证。首次启动时，Gatekeeper 可能显示"
            echo "> 「已损坏，无法打开」。安装后可在终端执行"
            echo "> \`xattr -cr /Applications/Verso.app\` 移除隔离属性；此操作仅需执行一次，不影响后续应用内更新。"
          } >> body.md
          gh release edit "$TAG" --notes-file body.md
