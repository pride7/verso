[package]
name = "verso"
version = "0.7.47"
description = "本地优先、排版考究、公式输入极快的笔记软件"
authors = ["pride7"]
license = "Apache-2.0"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "verso_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ulid = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
# GitHub 快速共享的 REST 请求；同时被安卓的 libgit2 自定义 https 传输层复用。
# rustls 让四个平台都不依赖系统 OpenSSL。
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

# keyring（同步令牌的钥匙串存储）在文件末尾的 target 表里 —— 它没有安卓
# 后端，安卓上会静默退回**内存 mock**（令牌重启就丢，症状极难自查），
# 所以安卓走 vault/secret.rs 里的文件后端，桌面才用 keyring。

# 索引（§2.5）。bundled 把 SQLite 一起编进来，不依赖系统库；
# FTS5 是全文搜索必需的。
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
# 文件监听（§2.7）。外部程序（AI CLI、git、别的编辑器）改了文件要能发现。
notify = "8"
# 内容哈希：mtime 不可信时的兜底（同步工具会破坏 mtime）
blake3 = "1"

# 内嵌终端（§7.3 方案 B）。WezTerm 出品，Windows 走 ConPTY。
portable-pty = "0.9"
# PTY 输出是原始字节，一个多字节 UTF-8 字符可能被读取边界切开。
# 用 base64 原样传给前端、由 xterm 自己解码，中文输出才不会变乱码。
base64 = "0.22"

# §2.8 的底座。M5b 打开了网络特性：
# - https：走系统 TLS，**不引入 openssl**（vendored-openssl 会让 Windows
#   构建变成一场噩梦，而系统 TLS 用的本来就是用户已经信任的那套根证书）
# - ssh：libssh2，配合 ssh-agent 或 ~/.ssh 下的默认密钥
#
# **`https` 只给桌面开。** Android 上 libgit2 的 https 后端是 OpenSSL
# （Windows 走 schannel，不需要额外的东西），
# 而系统里没有可链接的 OpenSSL，只能 vendored 从源码编 —— 那条路在 Windows
# 主机上要一个「产生 Unix 风格路径、且 core 模块齐全」的 perl，git 自带的
# MSYS perl 被精简过（缺 Locale::Maketext::Simple、ExtUtils::MakeMaker…），
# Strawberry 又被 OpenSSL 的 Configure 以「路径风格不对」当场拒掉。
#
# 补模块是打地鼠，而且补出来的东西 `scoop update git` 一次就冲掉。所以
# 安卓不走 OpenSSL：给 libgit2 注册一个 rustls 的自定义传输层
# （vault/transport.rs），纯 Rust，NDK 直接编，包还更小。上面的 ureq 同时
# 供这个传输层和 GitHub 快速共享复用。
[target.'cfg(not(any(target_os = "android", target_os = "macos")))'.dependencies]
git2 = { version = "0.20", default-features = false, features = ["https"] }

# macOS 上 `https` 同样要 OpenSSL —— 曾经以为它走 Security.framework，
# **是错的**，第一次跑 CI 就撞上了：`Could not find directory of OpenSSL
# installation`。而 macOS 系统里没有可链接的 OpenSSL 头文件（Apple 早就
# 把它从 SDK 里拿掉了）。
#
# 这里能用 vendored 而 Windows 上不能，差别在 perl：macOS 自带一个完整的
# perl，OpenSSL 的 Configure 跑得起来；Windows 上那条路是打地鼠（见上面）。
#
# 顺带解决了交叉编译：CI 在 arm64 的机器上还要产出一份 x86_64 的包，
# 而 Homebrew 装的 OpenSSL 只有本机那个架构，vendored 是从源码按目标架构编的
[target.'cfg(target_os = "macos")'.dependencies]
git2 = { version = "0.20", default-features = false, features = ["https", "vendored-openssl"] }

[target.'cfg(target_os = "android")'.dependencies]
git2 = { version = "0.20", default-features = false }
# https 传输层（vault/transport.rs）复用上面的 ureq：TLS 走 rustls + webpki
# 内置根证书。全是纯 Rust，NDK 交叉编译不需要 OpenSSL/perl

# 同步令牌的钥匙串存储（vault/secret.rs）。**不给安卓**：keyring 没有安卓
# 后端，会静默退回内存 mock —— 令牌「存进去了」但重启就丢，症状是每次
# 打开应用都要重填一遍还查不出为什么。安卓在 secret.rs 里走应用私有目录
# 的文件后端
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# 自动更新（§2.11）。**只有桌面有。**
#
# updater 插件本身就不支持移动端 —— 安卓的包由应用商店或 APK 安装器管，
# 一个应用没有权限就地替换自己。写成 target 依赖而不是 `optional`：
# 依赖一旦进了图，安卓那边就要跟着编译它，而它编不过。
#
# process 插件在这里只为一件事：装完之后重启（`relaunch`）。
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
