[package]
name = "verso"
version = "0.6.2"
description = "本地优先、排版考究、公式输入极快的笔记软件"
authors = ["xsfeng"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "verso_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ulid = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

# §2.8 的底座。M5b 打开了网络特性：
# - https：走系统 TLS，**不引入 openssl**（vendored-openssl 会让 Windows
#   构建变成一场噩梦，而系统 TLS 用的本来就是用户已经信任的那套根证书）
# - ssh：libssh2，配合 ssh-agent 或 ~/.ssh 下的默认密钥
git2 = { version = "0.20", default-features = false, features = ["https"] }
# 同步用的访问令牌存进系统钥匙串（Windows 凭据管理器 / macOS 钥匙串），
# **不进设置文件**：那是明文 JSON，会被备份、会被同步、会被顺手贴给别人看。
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# 索引（§2.5）。bundled 把 SQLite 一起编进来，不依赖系统库；
# FTS5 是全文搜索必需的。
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
# 文件监听（§2.7）。外部程序（AI CLI、git、别的编辑器）改了文件要能发现。
notify = "8"
# 内容哈希：mtime 不可信时的兜底（同步工具会破坏 mtime）
blake3 = "1"

# 内嵌终端（§7.3 方案 B）。WezTerm 出品，Windows 走 ConPTY。
portable-pty = "0.9"
# PTY 输出是原始字节，一个多字节 UTF-8 字符可能被读取边界切开。
# 用 base64 原样传给前端、由 xterm 自己解码，中文输出才不会变乱码。
base64 = "0.22"
