[package]
name = "verso"
version = "0.5.8"
description = "本地优先、排版考究、公式输入极快的笔记软件"
authors = ["xsfeng"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "verso_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ulid = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

# M0 只用到 Repository::init。default-features = false 关掉 https/ssh，
# 避免在 Windows 上引入 openssl。M5 做同步时再打开网络特性。
git2 = { version = "0.20", default-features = false }

# 索引（§2.5）。bundled 把 SQLite 一起编进来，不依赖系统库；
# FTS5 是全文搜索必需的。
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
# 文件监听（§2.7）。外部程序（AI CLI、git、别的编辑器）改了文件要能发现。
notify = "8"
# 内容哈希：mtime 不可信时的兜底（同步工具会破坏 mtime）
blake3 = "1"

# 内嵌终端（§7.3 方案 B）。WezTerm 出品，Windows 走 ConPTY。
portable-pty = "0.9"
# PTY 输出是原始字节，一个多字节 UTF-8 字符可能被读取边界切开。
# 用 base64 原样传给前端、由 xterm 自己解码，中文输出才不会变乱码。
base64 = "0.22"
