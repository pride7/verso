[package]
name = "folio"
version = "0.2.2"
description = "本地优先、排版考究、公式输入极快的笔记软件"
authors = ["xsfeng"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "folio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ulid = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

# M0 只用到 Repository::init。default-features = false 关掉 https/ssh，
# 避免在 Windows 上引入 openssl。M5 做同步时再打开网络特性。
git2 = { version = "0.20", default-features = false }

# 内嵌终端（§7.3 方案 B）。WezTerm 出品，Windows 走 ConPTY。
portable-pty = "0.9"
# PTY 输出是原始字节，一个多字节 UTF-8 字符可能被读取边界切开。
# 用 base64 原样传给前端、由 xterm 自己解码，中文输出才不会变乱码。
base64 = "0.22"
